version: 2
updates:
  - package-ecosystem: gomod
    directory: "/ollarouter"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/webui"
    schedule:
      interval: weekly
    groups:
      all-npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/ollarouter"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
