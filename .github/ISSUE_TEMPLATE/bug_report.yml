name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which endpoint, provider type or part of the admin console?
      placeholder: e.g. /api/chat streaming, anthropic adapter, virtual models, Usage page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Request, providers.yaml (with keys removed) and server log lines.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OllaRouter version, OS, Docker or binary, client (Open WebUI, Continue, ...)
